name: Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test and build
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Python python -DistPath 'dist/2.0.0'
      - uses: actions/upload-artifact@v4
        with:
          name: MetaSeries-Organiser-2.0.0-Windows
          path: |
            dist/2.0.0/MetaSeries-Organiser-Windows.zip
            dist/2.0.0/MetaSeries-Organiser-Windows.zip.sha256
            dist/2.0.0/MetaSeries-Organiser-Source.zip
            dist/2.0.0/MetaSeries-Organiser-Source.zip.sha256
          if-no-files-found: error
